<section class="py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <p class="text-uppercase text-muted small fw-semibold mb-1">Dashboard</p>
      <h1 class="mb-0">Registro studenti</h1>
    </div>
    <a class="btn btn-primary" routerLink="/inserimento">Aggiungi studente</a>
  </div>

  <div class="row g-4 mb-4">
    <div class="col-md-4">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body">
          <p class="text-muted mb-1">Numero studenti</p>
          <h2 class="display-6 mb-0">{{ numero() }}</h2>
        </div>
      </div>
    </div>

    <div class="col-md-8">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body">
          <p class="text-muted mb-3">Studente migliore</p>
          @if (migliore(); as migliore) {
            <app-studente-card [studente]="migliore" [azioni]="false" />
          } @else {
            <p class="mb-0 text-muted">Nessuno studente disponibile.</p>
          }
        </div>
      </div>
    </div>
  </div>
</section>
