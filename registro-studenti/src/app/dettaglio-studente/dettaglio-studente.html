<section class="py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <p class="text-uppercase text-muted small fw-semibold mb-1">Dettaglio</p>
      <h1 class="mb-0">Scheda studente</h1>
    </div>
    <a class="btn btn-outline-secondary" routerLink="/elenco">Torna all'elenco</a>
  </div>

  @if (studente(); as studente) {
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="mb-0">{{ studente.nome }}</h2>
          <span class="badge text-bg-primary fs-6">{{ studente.classe }}</span>
        </div>

        <p class="mb-3"><strong>ID:</strong> {{ studente.id }}</p>
        <p class="mb-3"><strong>Media voti:</strong> {{ studente.mediaVoti.toFixed(2) }}</p>

        <div class="d-flex flex-wrap gap-2">
          <button type="button" class="btn btn-primary" (click)="vaiAlSuccessivo()">
            Studente successivo
          </button>
          <button type="button" class="btn btn-outline-danger" (click)="rimuovi()">
            Rimuovi dal registro
          </button>
          <a class="btn btn-outline-secondary" [routerLink]="['/modifica', studente.id]">
            Modifica
          </a>
        </div>
      </div>
    </div>
  } @else {
    <div class="alert alert-warning">Studente non trovato.</div>
  }
</section>
