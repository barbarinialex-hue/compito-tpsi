<section class="py-4">
  <div class="mb-4">
    <p class="text-uppercase text-muted small fw-semibold mb-1">Modifica</p>
    <h1 class="mb-0">Aggiorna studente</h1>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <div class="mb-3">
        <label class="form-label" for="nome">Nome</label>
        <input id="nome" class="form-control" type="text" [ngModel]="nome()" (ngModelChange)="nome.set($event)" />
      </div>

      <div class="mb-3">
        <label class="form-label" for="classe">Classe</label>
        <input id="classe" class="form-control" type="text" [ngModel]="classe()" (ngModelChange)="classe.set($event)" />
      </div>

      <div class="mb-4">
        <label class="form-label" for="media">Media voti</label>
        <input id="media" class="form-control" type="number" step="0.1" min="0" max="10" [ngModel]="mediaVoti()" (ngModelChange)="mediaVoti.set($event)" />
      </div>

      <div class="d-flex gap-2">
        <button type="button" class="btn btn-primary" (click)="salva()">Salva modifiche</button>
        <a class="btn btn-outline-secondary" routerLink="/elenco">Annulla</a>
      </div>
    </div>
  </div>
</section>
